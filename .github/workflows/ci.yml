name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: bash tests/run.sh
      - name: Translations are up to date
        run: |
          python3 tools/i18n.py build
          git diff --exit-code -I '^"POT-Creation-Date' -I '^#:' -- local-tts/languages/local-tts.pot || (echo "Run: python3 tools/i18n.py build" && exit 1)
      - name: Build
        run: python3 tools/build.py --check
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: local-tts-zip
          path: dist/*.zip
